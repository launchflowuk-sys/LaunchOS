services:
  postgres:
    image: postgres:17-alpine
    container_name: launchos-postgres
    restart: unless-stopped
    # The default 100 is a serving figure, and this database serves a test run:
    # a few hundred files across several vitest workers, each with its own
    # client. Exhausting it does not fail loudly — it surfaces as one unrelated
    # assertion failing per run, which reads as flakiness for days before
    # anybody counts connections.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: launchos
      POSTGRES_PASSWORD: launchos
      POSTGRES_DB: launchos
    ports:
      - "5432:5432"
    volumes:
      - launchos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchos -d launchos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  launchos_pgdata:
