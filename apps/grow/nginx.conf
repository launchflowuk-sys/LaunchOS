# The campaign landing page, served as files.
#
# Adapted from the handover package's own template. Two rules matter and both
# are deliberate:
#
#   * A missing file is a 404, never `index.html`. A single-page-app fallback
#     here would answer a broken `<img>` or a mistyped `style.css` with the
#     landing page itself and a 200, which is how a deployment passes every
#     check while serving an unstyled page.
#   * Nothing touches the query string. Campaign tags arrive on the URL and
#     `app.js` reads them off `window.location.search`; a redirect that drops
#     them would lose the attribution this whole page exists to carry.
#
# HTTPS is Traefik's job in front of the container, as it is for the web app.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Kept out of organic search, on Shoji's call. This page says most of what
    # the homepage says, and a second copy on a subdomain competing with
    # launchflow.co.uk for the same terms costs more than it wins — a
    # paid-traffic page loses nothing by being unindexed. The `<meta>` tag says
    # the same thing; the header covers anything that is not the HTML.
    add_header X-Robots-Tag "noindex, follow" always;

    location / {
        try_files $uri $uri/ =404;
        # The HTML, the stylesheet and both scripts are unversioned, so a
        # redeploy has to be visible immediately rather than after a cache.
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }
}
